name: checks

# The kernel is built, and the test suite and the corpus run with it, on every push and on a
# pull request from a fork. The suite runs as six jobs, each a share of the test modules
# (tests/parallel.py --shard), so a push has its answer in about the time of the longest
# module. The corpus runs twice: by `petra check`, and by the kernel alone. The proofs of
# the kernel's interval rule (docs/proved.md) are built against Mathlib and held to Lean's
# three standard axioms. A wheel with the kernel inside is built and tested for each of five
# platforms (wheels.yml), and each is kept as an artifact of the run. The
# absurd-design gap with one job per seed, canary recall, and the metamorphic relations over
# the steel gate's stream run when the workflow is started by hand. The steel gate stays off
# CI because it reads the full AISC shapes workbook, which is not in the repository.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      n:
        description: designs per seed for the absurd-design gap
        default: "18000"
      seeds:
        description: gap seeds as a JSON list, one job each
        default: "[1, 2, 3]"
      recall:
        description: also run canary recall (seed 2, budget 600)
        type: boolean
        default: true
      metamorphic:
        description: also run the metamorphic relations (steel gate stream, seed 1, 10000 designs)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  kernel:
    # A pull request from a branch of this repository already ran on its push.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            kernel/.lake
          key: kernel-${{ runner.os }}-${{ hashFiles('kernel/**') }}
      - name: Build the kernel
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          cd kernel && "$HOME/.elan/bin/lake" build
      - uses: actions/upload-artifact@v4
        with:
          name: petra-verify
          path: kernel/.lake/build/bin/petra-verify

  proofs:
    # proofs/ depends on Mathlib and on kernel/ by path. `lake exe cache get` fetches Mathlib's
    # prebuilt files, so nothing of Mathlib compiles here: without them the build would take
    # hours, and the timeout stops it. proofs/check_axioms.py then builds the proofs and
    # fails on a `sorry`, on an axiom beyond propext, Classical.choice and Quot.sound in a
    # main theorem, and on a docs/proved.md that holds other lines than it prints.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The toolchain, and the archives `lake exe cache get` downloads, which it keeps in
      # ~/.cache/mathlib. Both change only with the pinned toolchain and the pinned Mathlib.
      # The unpacked files, about 7 GB under proofs/.lake, are not kept: unpacking them
      # again takes less time than restoring them would.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
          key: proofs-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain', 'proofs/lake-manifest.json') }}
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib's prebuilt files
        working-directory: proofs
        run: lake exe cache get
      - name: Build the proofs and check their axioms
        working-directory: proofs
        run: python check_axioms.py

  suite:
    needs: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 scipy==1.17.1
      - uses: actions/download-artifact@v4
        with:
          name: petra-verify
          path: kernel/.lake/build/bin
      - run: chmod +x kernel/.lake/build/bin/petra-verify
      - run: python tests/parallel.py --shard "${{ matrix.share }}/6" -j "$(nproc)"

  corpus:
    needs: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 scipy==1.17.1
      - uses: actions/download-artifact@v4
        with:
          name: petra-verify
          path: kernel/.lake/build/bin
      - run: chmod +x kernel/.lake/build/bin/petra-verify
      - run: python corpus/run.py
      - run: python corpus/run.py --kernel kernel/.lake/build/bin/petra-verify

  wheels:
    # The wheels a release would publish: one job for each platform, on a runner of that
    # platform. The artifacts are named wheel-<platform tag>.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    uses: ./.github/workflows/wheels.yml

  gap:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(inputs.seeds || '[1]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 scipy==1.17.1
      - run: python scripts/absurd_gap.py --n "${{ inputs.n }}" --seeds "${{ matrix.seed }}" --workers "$(nproc)" --out out
      - uses: actions/upload-artifact@v4
        with:
          name: gap-seed-${{ matrix.seed }}
          path: out/

  recall:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recall }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 scipy==1.17.1
      - run: python scripts/canary_recall.py --seed 2 --budget 600 --workers "$(nproc)" --out out
      - uses: actions/upload-artifact@v4
        with:
          name: canary-recall
          path: out/

  metamorphic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.metamorphic }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 scipy==1.17.1
      - run: python scripts/metamorphic.py --n 10000 --seed 1 --workers "$(nproc)" --out out
      # the log names every broken relation, so it is kept when the run fails
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metamorphic
          path: out/
