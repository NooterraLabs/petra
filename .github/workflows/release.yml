name: release

# Publishes Petra to PyPI when a tag v<version> is pushed: the sdist, and one wheel for each
# of five platforms with the kernel inside. The wheels are built and tested by wheels.yml,
# as on every push. The sdist holds no kernel, so Petra installed from it says in each report
# that no kernel ran. PyPI trusts this workflow through trusted publishing, so the
# repository stores no token. The upload carries a Sigstore attestation for each file.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The tag names the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: pip install build twine
      - run: python -m build --sdist
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  kernel:
    # The suite needs the kernel: with none there is no verdict, and the tests that ask for one fail.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            kernel/.lake
          key: kernel-${{ runner.os }}-${{ hashFiles('kernel/**') }}
      - name: Build the kernel
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          cd kernel && "$HOME/.elan/bin/lake" build
      - uses: actions/upload-artifact@v4
        with:
          name: petra-verify
          path: kernel/.lake/build/bin/petra-verify

  wheels:
    uses: ./.github/workflows/wheels.yml

  test:
    needs: [build, kernel]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: petra-verify
          path: kernel/.lake/build/bin
      - run: chmod +x kernel/.lake/build/bin/petra-verify
      - run: python tests/parallel.py --local -j "$(nproc)"
      - name: The sdist installs and runs outside the repository, and says that no kernel ran
        run: python scripts/wheel_check.py dist/*.tar.gz --no-kernel

  publish:
    needs: [build, wheels, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/petra-lang/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      - name: The release is the sdist and the five wheels
        run: |
          ls -l dist
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1
          test "$(ls dist/*.whl | wc -l)" -eq 5
          test "$(ls dist | wc -l)" -eq 6
      - uses: pypa/gh-action-pypi-publish@release/v1
